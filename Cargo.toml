[workspace]
resolver = "2"
members = [
    "crates/capsule-core",
    "crates/capsule-memory",
    "crates/capsule-cpu",
    "crates/capsule-boot",
    "crates/capsule-devices",
    "crates/capsule-storage",
    "crates/capsule-network",
    "crates/capsule-vmm",
    "crates/capsule-gui",
]
default-members = ["crates/capsule-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CapsuleOS Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/codigominimo/CapsuleOS"

[workspace.dependencies]
windows-sys = { version = "0.61.2" }


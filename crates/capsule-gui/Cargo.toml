[package]
name = "capsule-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "capsule"
path = "src/main.rs"

[dependencies]
capsule-core = { path = "../capsule-core" }
capsule-memory = { path = "../capsule-memory" }
capsule-cpu = { path = "../capsule-cpu" }
capsule-boot = { path = "../capsule-boot" }
capsule-devices = { path = "../capsule-devices" }
capsule-network = { path = "../capsule-network" }
capsule-storage = { path = "../capsule-storage" }
capsule-vmm = { path = "../capsule-vmm" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
] }
